name: Modernization foundation

on:
  push:
    paths: ['apps/**', 'packages/**', 'tests/**', 'scripts/tooling/**', 'package*.json', '*config*', '.nvmrc', '.npmrc', '.github/workflows/foundation.yml']
  pull_request:
    paths: ['apps/**', 'packages/**', 'tests/**', 'scripts/tooling/**', 'package*.json', '*config*', '.nvmrc', '.npmrc', '.github/workflows/foundation.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: development
      DATABASE_MODE: disabled
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:foundation
      - run: npm run smoke:foundation
