name: Modernization foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: development
  DATABASE_MODE: disabled
  WEB_ORIGIN: http://127.0.0.1:3000
  NEXT_TELEMETRY_DISABLED: '1'
  AL_MINA_ISOLATED_BUILD: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:release

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run test:api
      - name: Real MongoDB transaction, catalog, lifecycle and load regressions
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-performance
          include-hidden-files: true
          path: .verification-results/performance-api.json
          if-no-files-found: ignore

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build:commerce
      - name: Production foundation build
        run: npm run build:foundation
      - run: npm run smoke:foundation
      - run: npm run smoke:storefront
      - name: Raw crawler HTML and recovered product URL/price compatibility
        run: npm run smoke:seo
      - name: Chromium customer and admin workflows
        run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          include-hidden-files: true
          path: .verification-results/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit every lockfile; high and critical findings block promotion
        run: npm run audit:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-audit
          include-hidden-files: true
          path: .verification-results/audit-*.json
          retention-days: 7

  verify:
    # Preserve the existing required check name. Skipped/cancelled jobs fail this gate.
    if: always()
    needs: [quality, api, browser, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_RESULT: ${{ needs.api.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$API_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$AUDIT_RESULT" = success
