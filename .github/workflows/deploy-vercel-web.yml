name: Deploy verified storefront to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: Full master commit SHA with successful CI verification
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: vercel-storefront-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      deploy: ${{ steps.candidate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require a verified commit already merged into master
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.commit || github.sha }}
        run: node scripts/tooling/verify-vercel-candidate.mts

  web:
    needs: verify
    if: needs.verify.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: vercel-production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check deployment identity
        run: |
          [[ "$VERCEL_ORG_ID" =~ ^team_[A-Za-z0-9]+$ ]]
          [[ "$VERCEL_PROJECT_ID" == 'prj_PftjAFsj6BSwrZnXgYZBFv0alGhF' ]]
      - name: Install the pinned official deployment CLI
        run: npm install --global vercel@64.5.0
      - name: Pull the existing frontend project's production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build the frontend artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { parseEnv } from 'node:util';
          import { requireProductionVercelEnvironment } from './scripts/tooling/production-vercel-config.mjs';
          const project = JSON.parse(readFileSync('.vercel/project.json', 'utf8'));
          const env = parseEnv(readFileSync('.vercel/.env.production.local', 'utf8'));
          if (project.projectId !== process.env.VERCEL_PROJECT_ID || project.orgId !== process.env.VERCEL_ORG_ID) {
            throw new Error('Vercel project identity mismatch');
          }
          requireProductionVercelEnvironment(env);
          NODE
          vercel build --prod --token="$VERCEL_TOKEN"
      - name: Publish the verified frontend artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Check the live website and API (read-only)
        run: node scripts/tooling/smoke-production.mjs
