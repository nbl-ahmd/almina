name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/tooling/ci-changes.mts

  quality:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:release
      - name: Audit dependency security
        run: npm run audit:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-security-audit
          include-hidden-files: true
          path: .verification-results/audit-*.json
          retention-days: 7
          if-no-files-found: ignore

  api:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run test:api
      - name: Real MongoDB transaction, catalog, lifecycle and load regressions
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-performance
          include-hidden-files: true
          path: .verification-results/performance-api.json
          if-no-files-found: ignore

  build:
    env:
      APP_ENV: development
      DATABASE_MODE: disabled
      WEB_ORIGIN: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
      AL_MINA_ISOLATED_BUILD: '1'
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build production API and storefront
        run: npm run build:foundation
      - name: Check production HTML, indexing and URL compatibility
        run: npm run smoke:seo

  verify:
    # Keep the protected branch check name. Only reviewed docs-only skips are allowed.
    if: always()
    needs: [changes, quality, api, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          API_RESULT: ${{ needs.api.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
        run: |
          test "$CHANGES_RESULT" = success
          expected=success
          if [ "$RUNTIME" = false ]; then expected=skipped; fi
          failed=0
          for result in "quality:$QUALITY_RESULT" "api:$API_RESULT" "build:$BUILD_RESULT"; do
            job=${result%%:*}
            status=${result#*:}
            echo "$job: $status" >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" != "$expected" ]; then
              echo "::error::$job finished with $status. Open the $job job for the underlying failure."
              failed=1
            fi
          done
          exit "$failed"
