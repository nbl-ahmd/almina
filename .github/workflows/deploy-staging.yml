name: Deploy verified staging release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA with successful CI verification
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require the tested merged code
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ inputs.commit }}
        run: node scripts/tooling/verify-vercel-candidate.mts

  backend:
    needs: verify
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy staging backend at the verified commit and await live status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_STAGING_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_STAGING_API_SERVICE_ID }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          DEPLOYMENT_ENV: staging
        run: node scripts/tooling/deploy-render-staging.mjs --apply

  web:
    needs: [verify, backend]
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Deploy staging Next.js at the same verified commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_STAGING_TOKEN }}
          VERCEL_STAGING_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          RELEASE_COMMIT: ${{ inputs.commit }}
          DEPLOYMENT_ENV: staging
        run: node scripts/tooling/deploy-vercel-staging.mjs --apply
