# Review and apply on the actual HTTPS CRA document host; no deployment is performed here.
# The frontend must share this origin with /api and /socket.io through fixed upstream proxies.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://maxst.icons8.com https://maxcdn.bootstrapcdn.com; font-src 'self' data: https://fonts.gstatic.com https://maxst.icons8.com https://maxcdn.bootstrapcdn.com; img-src 'self' data: blob: https://cdn.alminapharmacy.com https://*.tile.openstreetmap.org; connect-src 'self' https://overpass-api.de https://nominatim.openstreetmap.org; frame-src 'none'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
# Do not add wildcard script hosts, unsafe-inline or unsafe-eval to script-src.
# Keep API/auth responses uncached. Any child location using add_header must repeat these.
